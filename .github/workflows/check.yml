# Der Wächter über allen Wächtern.
#
# Vorher lief KEINE Prüfung automatisch: der einzige Workflow
# (prozesse-staging.yml) startet nur von Hand oder bei Push auf `staging`.
# Damit hingen Registry-Abdeckung, Migrations-Wächter, Doku-Wächter,
# Daten-TÜV und Prozessvollständigkeit allein an der Disziplin des
# Einzelnen — also genau an dem, was sie ersetzen sollten.
#
# Dieser Workflow führt `npm run check` (Linter + Typprüfung + Tests +
# Prozessläufe) auf jedem Push und jedem Pull Request aus, gegen eine
# frische Postgres-Instanz im Service-Container. Laufzeit ~2 Minuten.
#
# Seit 2026-10-18 außerdem `npm audit --audit-level=high`: eine bekannte
# hohe oder kritische Lücke in einer Abhängigkeit macht die Prüfung rot —
# und weil Lücken auch ohne Push bekannt werden, läuft sie zusätzlich jeden
# Montagmorgen auf dem Hauptzweig. Updates liefert Dependabot als PR
# (.github/dependabot.yml).

name: Prüfung

on:
  push:
    branches-ignore: [staging]
  pull_request:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

concurrency:
  group: pruefung-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: erp
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/erp
      DIRECT_URL: ''
      # Die Testsuite legt Wegwerf-Datenbanken an (demodaten, Prozess-Harness).
      SEED_ADMIN_PASSWORD: ci-nur-fuer-tests

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten
        run: npm ci

      # Der Wächter über den Abhängigkeiten: rot ab „high". Mittlere und
      # niedrige Befunde stehen im Protokoll und auf dem Produktivgang.
      - name: Bekannte Lücken (npm audit)
        run: npm audit --audit-level=high

      - name: Schema einspielen
        run: npm run db:migrate

      # Genau wie das echte Deployment (scripts/vorbereiten.ts): nur der
      # Administrator, keine Beispieldaten. Die Tests bringen ihre eigenen
      # Voraussetzungen mit und laufen auch OHNE diesen Schritt durch —
      # geprüft. Er steht hier, damit die CI dem Produktionszustand
      # entspricht und nicht einem Sonderfall.
      - name: Administrator anlegen
        run: npm run db:seed

      - name: Linter
        run: npm run lint

      - name: Typprüfung
        run: npm run typecheck

      - name: Tests
        run: npm test

      # `timeout` statt eines Schritt-Limits: bei SIGINT gibt der Test-Runner
      # noch aus, was er hat, und der Schritt SCHEITERT sichtbar. Ein
      # abgebrochener Job verliert die gepufferte Ausgabe — genau daran ist
      # die Ursachensuche beim ersten Hänger gescheitert.
      - name: Prozessläufe
        run: timeout --signal=INT --kill-after=30s 300 npm run test:prozesse

      # Spur des Harness (Datenbank wegwerfen/anlegen/migrieren) — sie
      # entsteht VOR dem ersten Test und ist die einzige Ausgabe, die einen
      # Hänger im Aufbau verortet.
      - name: Harness-Spur
        if: always()
        run: cat prozess-harness.log || echo "keine Spur geschrieben"

      # Audit-Stand wie im Vercel-Build, damit der Produktivgang-Punkt hier
      # genauso entsteht wie in Produktion.
      - name: Audit-Stand
        run: npm run audit:stand

      # Der Build fängt, was die Tests nicht sehen: fehlerhafte Server/Client-
      # Grenzen, kaputte Importe in Seiten, ungültige Route-Signaturen.
      - name: Build
        run: npm run build
        env:
          # Ohne Schlüssel — der Build darf davon nicht abhängen.
          ANTHROPIC_API_KEY: ''
          OPENAI_API_KEY: ''
