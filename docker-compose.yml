# Lokales Komplettpaket zum Ausprobieren: Datenbank + ERP.
#
#   docker compose up --build
#   → http://localhost:3000   (admin@example.com / erp-admin)
#
# Beim ersten Start werden Schema, Administrator und Beispieldaten angelegt.
# Zum Zurücksetzen:  docker compose down -v

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp
      POSTGRES_DB: erp
    # Kein Port nach außen: die App erreicht die Datenbank über das
    # Compose-Netz. Wer mit psql hineinschauen möchte, entfernt die
    # Kommentarzeichen (Port ggf. anpassen, falls schon belegt):
    # ports:
    #   - '127.0.0.1:5433:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U erp -d erp']
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    # Alles aus der Datei .env landet im Container: ANTHROPIC_API_KEY für die
    # KI-Analyse, dazu Shopify, DHL und Resend. Die Datei ist optional — ohne
    # sie läuft das ERP genauso, nur ohne die externen Anbindungen.
    #
    # Wichtig: .env.example ist nur eine Vorlage und wird von niemandem
    # gelesen. Zum Eintragen:  cp .env.example .env
    env_file:
      - path: .env
        required: false
    # Diese Werte gewinnen gegen .env — sie beschreiben den Container, nicht
    # den Entwicklungsrechner. Sonst würde z. B. ein DATABASE_URL mit
    # "localhost:5433" oder ein PORT aus der .env den Start zerlegen.
    environment:
      DATABASE_URL: postgres://erp:erp@db:5432/erp
      # Innen immer 3000; nach außen ist der Port über ERP_PORT umstellbar.
      PORT: '3000'
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      STORAGE_DIR: /app/storage
      # Beispieldaten (Tastatur mit Farbvarianten, 20-Positionen-Stückliste,
      # Komponenten mit Bestand) gibt es NUR auf ausdrücklichen Wunsch:
      #   SEED_DEMO=true docker compose up --build
      # Niemals stillschweigend einspielen — auf einer Produktionsdatenbank
      # wäre das ein Datenunfall.
      SEED_DEMO: ${SEED_DEMO:-false}
      # Zugangsdaten des ersten Benutzers
      SEED_ADMIN_EMAIL: admin@example.com
      SEED_ADMIN_PASSWORD: erp-admin
      # Shopify und DHL bleiben leer: alle Module laufen, nur Label-Erstellung
      # und Bestellimport sind ohne Zugangsdaten deaktiviert.
    ports:
      # Port auf dem Rechner ist umstellbar, falls 3000 schon belegt ist:
      #   ERP_PORT=3001 docker compose up
      # oder dauerhaft eine Zeile ERP_PORT=3001 in die Datei .env schreiben.
      - '127.0.0.1:${ERP_PORT:-3000}:3000'
    volumes:
      - label-storage:/app/storage

  # Zeitsteuerung. Auf Vercel macht das die Plattform (vercel.json); lokal
  # gäbe es sonst gar keine — die Outbox liefe nie an, Fulfillment und
  # Bestell-Mails blieben liegen, die Kennzahlen wären eingefroren.
  cron:
    image: alpine:3
    depends_on:
      - app
    env_file:
      - path: .env
        required: false
    environment:
      ERP_URL: http://app:3000
    volumes:
      - ./docker/cron.sh:/cron.sh:ro
    command: ['sh', '/cron.sh']
    restart: unless-stopped

volumes:
  db-data:
  label-storage:
